  "*결과*: 실제 모델 200개를 대상으로 무효율과 전문가 쌍대 비교 Elo로 평가한 결과, 무효율 2%와 Elo 1075.5로 최고 성능을 달성했으며 Claude, GPT-4o, 비에이전트 Qwen 기준선을 상회했습니다.",
  "*성과*: 논문 1편이 _Applied Soft Computing_에 게재되었습니다.",
]


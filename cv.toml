[experience.experience-1]
project = "Controllable Code-based CAD Generation"
role = "Core Researcher"
org = "State Key Lab of Manufacturing Technology & Equipment"
location = "Guangzhou, China"
start = "Mar 2025"
end = "Present"
summary = "Built a high-quality Code-based CAD benchmark; Built an agent with a constraint-first loop and achieved high performance. [Submitted to ICML 2026 (Under Review)]"
details = [
  "*Problem*: Text-to-CAD in main format often produces invalid solids and misses key dimensions and fit constraints. Code-based CAD is a great alternative, but it is challenging to ensure code correctness and constraint satisfaction, especially for complex designs.",
  "*Data & Benchmark Curation*: Given by the data scarcity in code-based CAD, we developed a dedicate pipeline to curate from real-world CAD models.", 
  "*Reliability-first generation loop*: Turn briefs into constraints, execute candidates, read failures, and repair until checks pass.",
  "*Reproducible evaluation from real designs*: Curated 10k parts and 1.7k assemblies; paired each with fixed checks and references.",
  "*Results*: Invalid rate 1.8% (parts) and 2.4% (assemblies). All-check pass rate +17.1 points for parts (52.3%) and +21.5 points for assemblies (41.9% vs 20.4% best baseline). Shape overlap 78.9 (parts). Pass rate 65.7% (parts) and 54.2% (assemblies).",
  # "*Stack*: #link-with-icon(url:\"https://github.com/vllm-project/vllm\", text:\"vLLM\") (Inference), #link-with-icon(url:\"https://openhands.dev/\", text:\"OpenHands\")(Agent Scaffold) , #link-with-icon(url:\"https://github.com/laude-institute/harbor\", text:\"Harbor\"), #link-with-icon(url:\"https://laminar.sh/\", text:\"Laminar\")(Eval & Observation)",
]

[experience.experience-2]
project = "Automated Color Difference Control & Calibration"
role = "Lead Developer"
org = "Vograce"
location = "Yiwu, Zhejiang"
start = "Dec 2024"
end = "Jul 2025"
summary = "Built an AI-driven color difference detection and calibration system for personalized printing lines, achieving ~20× efficiency over manual inspection while ensuring consistent color reproduction."
details = [
  "Problem: Personalized printing had inconsistent color reproduction and labor-heavy QA.",
  "Method: Calibrated machine-vision capture; $Delta E$ (CIEDE2000) computation, adaptive sRGB↔CMYK feedback, operator guidance and audit trails.",
  "Result: Detection→recommendation latency ↓ to ~1 s/image; ≈20× efficiency vs. manual inspection in pilot line runs.",
  "Stack: Python/OpenCV, color science libs, Gradio dashboards; Ops integration with SOP checklists.",
]

[experience.experience-3]
project = "LLM-based Cosmetics Compliance Assistant"
role = "Intern Developer"
org = "Commercial Blockchain Technology Co., Ltd."
location = "Guangzhou, Guangdong"
start = "May 2023"
end = "Jul 2023"
summary = "Built an assistant to help compliance reviewers check cosmetics materials against regulations, reducing review time by ~40–60% while improving traceability."
details = [
  "Objective: From single-product materials (ingredients, registration/filing records, labels), compare against statutory documents and internal guidelines to produce traceable, cite-linked compliance prompts.",
  "Retrieval: hybrid BM25 + dense embeddings; top-k retrieval with MMR diversity; cross-encoder re-ranking for precision\\@k.",
  "Prompting: role-grounded templates with requirement decomposition; tool hints for citation spans; refusal rules for out-of-scope asks.",
  "Tracing: per-claim citation mapping (article/paragraph), confidence tags, and rationale summaries; exportable audit JSON.",
  "Demo & Ops: Built a Gradio prototype for early testing; added batch mode and redline diffs for changed statutes; integrated to front-end review queue.",
  "Impact: Average human review time reduced from ~3 min to ~1–2 min per item (≈40–60% faster) while improving traceability (every suggestion back-referenced to clause-level citations).",
  "Stack: Python, FAISS/elastic-like retriever (hybrid), Gradio UI, prompt engineering; governance with versioned KB and test queries.",
]



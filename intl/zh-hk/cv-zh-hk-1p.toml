summary = "面向可執行約束條件，構建咗可控程式化 CAD 生成嘅可驗證基準同 LLM Agent。"
details = [
  "*Agent 基礎設施*: 構建咗具備固定工具鏈同可重現實驗環境嘅_多語言容器化程式碼執行沙箱_。設計咗可_橫向擴展_嘅後端，用於收集多條 Agent 軌跡同失敗日誌，以支撐大規模實驗可觀測性；同時實現咗用於快速除錯同產物生成嘅_輕量 Web Playground_。",
  "*基準構建*: 基於從公開倉庫同 CAD 社群收集嘅 20 萬規模人工 CAD 程式碼語料構建基準。結合_確定性與啟發式規則_（如模糊去重）同 LLM 流程，_降低數據污染並控制任務難度_；最終產出 1 萬個單零件任務同 1700 個裝配任務，並配套黃金參考工作區同可執行測試。",
  "*Agent 設計*: 設計咗透過自測試同自修復來生成/編輯 CAD 程式嘅 LLM _架構_。唔同於只喺單檔有效嘅既有方法，呢個 Agent 可以喺裝配場景嘅多檔工作區中調用特定工具（例如由自然語言提取規格嘅 `spec` 工具），實現閉環修復。",
  "*評測與結果*: 以可執行測試作為核心指標評估約束滿足率。喺裝配任務上，本方法取得 54.2% pass rate、41.9% all-tests success、2.4% 無效輸出，並喺保持幾何保真度嘅同時喺約束滿足方面超過以往 LLM-only（如 GPT-5）同工具增強基線。",
  "*成果*: 1 篇論文已投稿至 _43rd International Conference on Machine Learning_（*ICML 2026*）並在審。",
]



summary = "실행 가능한 제약 조건 하에서, 제어 가능한 코드 기반 CAD 생성을 위한 검증 가능한 벤치마크와 LLM 에이전트를 구축했습니다."
details = [
  "*에이전트 인프라*: 고정된 툴체인과 재현 가능한 실행 환경을 갖춘 _다국어 컨테이너형 코드 실행 샌드박스_를 구축했습니다. 대규모 실험 관측을 위해 에이전트의 다양한 trajectory와 실패 로그를 수집하는 _수평 확장형_ 백엔드를 설계했고, 빠른 디버깅과 산출물 생성을 위한 _경량 웹 플레이그라운드_도 구현했습니다.",
  "*벤치마크 구축*: 공개 저장소와 CAD 커뮤니티에서 수집한 20만 규모의 인간 작성 CAD 코드 코퍼스를 기반으로 벤치마크를 구축했습니다. _결정론적/휴리스틱 규칙_(예: 퍼지 중복 제거)과 LLM 기반 파이프라인을 결합해 _데이터 오염을 줄이고 과제 난이도를 제어_했으며, 골든 레퍼런스 워크스페이스와 실행 가능한 테스트를 포함한 단일 부품 1만 개, 조립 1.7천 개 태스크를 생성했습니다.",
  "*에이전트 설계*: 자가 테스트와 자가 수정 루프를 통해 CAD 프로그램을 생성·편집하는 LLM _아키텍처_를 설계했습니다. 기존의 단일 파일 방식과 달리, 조립 과제의 다중 파일 워크스페이스에서 특정 도구(예: 자연어에서 명세를 추출하는 `spec` 도구)를 사용해 폐루프 수정이 가능하도록 했습니다.",
  "*평가 및 결과*: 실행 가능한 테스트를 핵심 지표로 사용해 제약 만족도를 계산했습니다. 조립 태스크에서 제안 방법은 통과율 54.2%, 전체 테스트 성공률 41.9%, 무효 출력 2.4%를 기록했고, 형상 점수를 유지하면서 prior LLM-only(예: GPT-5) 및 도구 기반 기준선을 제약 만족도에서 능가했습니다.",
  "*성과*: _43rd International Conference on Machine Learning_ (*ICML 2026*)에 논문 1편을 투고하여 심사 중입니다.",
]



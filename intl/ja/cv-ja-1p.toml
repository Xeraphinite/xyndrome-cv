summary = "実行可能な制約条件下で、制御可能なコードベースCAD生成のための検証可能ベンチマークとLLMエージェントを構築しました。"
details = [
  "*エージェント基盤*: 固定ツールチェーンと再現可能実行を備えた_多言語・コンテナ化コード実行サンドボックス_を構築しました。大規模実験の可観測性のため、複数のエージェント軌跡と失敗を収集する_水平スケーラブル_なバックエンドを設計し、迅速なデバッグと成果物生成向けに_軽量Webプレイグラウンド_も実装しました。",
  "*ベンチマーク構築*: 公開リポジトリとCADコミュニティから収集した20万件の人手CADコードコーパスを基にベンチマークを構築しました。_決定論的・ヒューリスティック規則_（例: あいまい重複排除）とLLMパイプラインを用いて_データ汚染を低減し課題難易度を制御_、ゴールデン参照ワークスペースと実行可能テスト付きで単体部品1万件・アセンブリ1,700件を作成しました。",
  "*エージェント設計*: 自己テストと自己修復を通じてCADプログラムを生成・編集するLLM _アーキテクチャ_を設計しました。単一ファイルでしか機能しない従来法と異なり、アセンブリ向けマルチファイル環境で特定ツール（例: 自然言語から仕様を抽出する `spec` ツール）を利用し、クローズドループで修正を導けます。",
  "*評価と結果*: 実行可能テストを主要指標として制約充足度を評価しました。アセンブリ課題で本手法は pass rate 54.2%、all-tests success 41.9%、invalid output 2.4% を達成し、幾何忠実性を保ちながら従来のLLM単体（例: GPT-5）およびツールベース手法を制約充足で上回りました。",
  "*成果*: _43rd International Conference on Machine Learning_（*ICML 2026*）に論文1本を投稿し、査読中です。",
]



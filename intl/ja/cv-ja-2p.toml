[experience.exp-1]
project = "コードベース CAD アセンブリ生成"
# stack = "vLLM, OpenHands, Docker, Kubernetes, Laminar"
role = "リーダー"
org = "製造技術・設備国家重点実験室"
location = "中国広東省広州市"
start = "2025年8月"
end = "現在"
summary = "実行可能な制約条件のもとで、制御可能なコードベース CAD 生成のための検証可能ベンチマークと LLM エージェントを構築しました。"
details = [
  "*エージェント基盤：* 固定ツールチェーンと再現可能な実行環境を備えた_多言語・コンテナ化コード実行サンドボックス_を構築しました。複数のエージェント軌跡と失敗記録を収集できる_水平スケーラブル_なバックエンドを設計し、大規模実験の可観測性を確保しました。さらに、迅速なデバッグと成果物生成のための_軽量 Web プレイグラウンド_も実装しました。",
  "*ベンチマーク構築：* 公開リポジトリと CAD コミュニティから収集した 20 万件の人手 CAD コードコーパスを基に、大規模ベンチマークを構築しました。_決定論的・ヒューリスティック規則_（例: あいまい重複排除）と LLM パイプラインを組み合わせ、_データ汚染を低減_し_課題難易度を制御_しました。最終的に、ゴールデン参照ワークスペースと実行可能テスト付きで、単体部品 1 万件・アセンブリ 1,700 件を作成しました。",
  "*エージェント設計：* 自己テストと自己修復を通じて CAD プログラムを生成・編集する LLM _アーキテクチャ_を設計しました。単一ファイル前提の従来手法と異なり、アセンブリ向けのマルチファイル環境で `spec`、`inspect`、`verify` などのツールを利用し、クローズドループで修正を行えます。",
  "*評価と結果：* 実行可能テストを主要指標として制約充足度を評価しました。アセンブリ課題では、pass rate 54.2%、all-tests success 41.9%、invalid output 2.4% を達成し、幾何忠実性を保ちながら制約充足においてベースラインを上回りました。",
  "*成果：* 論文 1 本を _第43回国際機械学習会議_（*ICML 2026*）に投稿し、査読中です。",
]

[experience.exp-2]
project = "Human-in-the-loop CAD 生成ワークフロー"
role = "リーダー"
org = "製造技術・設備国家重点実験室"
location = "中国広東省広州市"
start = "2024年12月"
end = "2025年5月"
summary = "コードの妥当性と人間の嗜好を両立する、コードベース CAD 生成向け HITL エージェントワークフローを設計しました。"
details = [
  "*ワークフロー設計：* 微調整済み `Qwen2.5-VL-7B` をバックボーンとして採用し、意図明確化・妥当性検証・反復改善・メモリ・安全ゲーティングを含む複数のコード生成ワークフローパターンを組み合わせました。",
  "*結果：* 実世界モデル 200 件を対象に invalid rate と専門家ペアワイズ Elo で評価し、invalid rate 2%、Elo 1075.5 で最高性能を達成しました。Claude、GPT-4o、非エージェント型 Qwen ベースラインを上回りました。",
  "*成果：* 論文 1 本が _Applied Soft Computing_ に掲載されました。",
]

[projects.project1]
title = "自動色差制御・キャリブレーション"
role = "リード開発者"
org = "Vograce"
location = "中国浙江省義烏市"
start = "2024年12月"
end = "2025年7月"
summary = "カスタム印刷生産における閉ループ色一貫性制御のため、マシンビジョンパイプラインを構築しました。"
details = [
  "*取得と検出：* さまざまな照明条件と素材反射に対応するため、光学取得環境を設計し、特徴マッチング整列と ROI 抽出を実装しました。これにより、多様な印刷パターンに対して堅牢な $Delta E$（CIEDE2000）計算を実現しました。",
  "*アルゴリズム：* sRGB 計測値を CMYK 空間へ変換し、適応的反復ステップ幅フィードバックを適用することで、測定色差を印刷オペレータ向けの実行可能なインク量調整提案へ変換しました。",
  "*結果：* `Gradio` による高速プロトタイピングと反復改善を通じて、検出から提案までのパイプライン全体を 1 画像あたり 1 秒以下に最適化し、パイロットラインで手動色合わせより 20 倍以上高速化しました。さらに `Next.js` と `FastAPI` によるフルスタック生産システムとして実装し、企業導入に対応しました。",
  "*成果：* ソフトウェア著作権を 2 件取得しました。",
]



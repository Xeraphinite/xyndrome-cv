[experience.exp-1]
project = "Code-based CAD Assembly Generation"
stack = "vLLM, OpenHands, Docker, Kubernetes, Laminar"
role = "Leader"
org = "State Key Lab of Manufacturing Technology & Equipment"
location = "Guangzhou, China"
start = "Aug 2025"
end = "Present"
summary = "面向可执行约束条件，构建了可控代码式 CAD 生成的可验证基准与 LLM Agent。"
details = [
  "*Agent 基础设施*: 构建了具备固定工具链与可复现实验环境的_多语言容器化代码执行沙箱_。设计了可_横向扩展_的后端，用于采集多条 Agent 轨迹与失败日志以支撑大规模实验可观测性；同时实现了用于快速调试和产物生成的_轻量级 Web Playground_。",
  "*基准构建*: 基于从公开仓库与 CAD 社区收集的 20 万规模人工 CAD 代码语料构建基准。结合_确定性与启发式规则_（如模糊去重）及 LLM 流水线，_降低数据污染并控制任务难度_；最终产出 1 万个单零件任务和 1700 个装配任务，并配套黄金参考工作区与可执行测试。",
  "*Agent 设计*: 设计了通过自测试与自修复生成/编辑 CAD 程序的 LLM _架构_。不同于仅在单文件中有效的既有方法，该 Agent 可在装配场景的多文件工作区中调用特定工具（如从自然语言提取规范的 `spec` 工具），实现闭环修复。",
  "*评测与结果*: 以可执行测试作为核心指标评估约束满足率。在装配任务上，本方法取得 54.2% pass rate、41.9% all-tests success、2.4% 无效输出，并在保持几何保真度的同时于约束满足方面超过以往 LLM-only（如 GPT-5）与工具增强基线。",
  "*成果*: 1 篇论文已投稿至 _43rd International Conference on Machine Learning_（*ICML 2026*）并在审。",
]



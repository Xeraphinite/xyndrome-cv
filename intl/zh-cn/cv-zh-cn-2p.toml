[experience.exp-1]
project = "代码式 CAD 装配生成"
# stack = "vLLM, OpenHands, Docker, Kubernetes, Laminar"
role = "负责人"
org = "制造技术与装备国家重点实验室"
location = "中国广东广州"
start = "2025 年 8 月"
end = "至今"
summary = "围绕可执行约束，构建了面向可控代码式 CAD 生成的可验证基准与 LLM Agent。"
details = [
  "*Agent 基础设施：* 构建了具备固定工具链与可复现实验环境的_多语言容器化代码执行沙箱_。设计了可_横向扩展_的后端，用于采集多条 Agent 轨迹与失败记录，支撑大规模实验可观测性；同时实现了用于快速调试与产物生成的_轻量级 Web Playground_。",
  "*基准构建：* 基于从公开仓库与 CAD 社区收集的 20 万规模人工 CAD 代码语料构建了大规模基准。结合_确定性与启发式规则_（如模糊去重）和 LLM 流水线，_降低数据污染_并_控制任务难度_；最终产出 1 万个单零件任务和 1700 个装配任务，并配套黄金参考工作区与可执行测试。",
  "*Agent 设计：* 设计了通过自测试与自修复生成或编辑 CAD 程序的 LLM _架构_。不同于仅支持单文件的既有方法，该 Agent 可在装配场景的多文件工作区中调用 `spec`、`inspect`、`verify` 等工具，实现闭环修复。",
  "*评测与结果：* 以可执行测试为核心指标评估约束满足率。在装配任务上，本方法取得 54.2% 通过率、41.9% 全测试通过率和 2.4% 无效输出率，并在保持几何保真度的同时于约束满足方面优于基线。",
  "*成果：* 1 篇论文已投稿至 _第 43 届国际机器学习大会_（*ICML 2026*）并在审。",
]

[experience.exp-2]
project = "人在回路 CAD 生成工作流"
role = "负责人"
org = "制造技术与装备国家重点实验室"
location = "中国广东广州"
start = "2024 年 12 月"
end = "2025 年 5 月"
summary = "设计了用于代码式 CAD 生成的 HITL Agent 工作流，在保证代码有效性的同时兼顾人类偏好。"
details = [
  "*工作流设计：* 以微调后的 `Qwen2.5-VL-7B` 为骨干，融合多种代码生成工作流模式，覆盖意图澄清、有效性校验、迭代优化、记忆与安全门控。",
  "*结果：* 在 200 个真实模型上以无效率与专家成对 Elo 评估，达到 2% 无效率和 1075.5 Elo 的最佳表现，优于 Claude、GPT-4o 及非 Agent 的 Qwen 基线。",
  "*成果：* 1 篇论文已发表于 _Applied Soft Computing_。",
]

[projects.project1]
title = "自动化色差控制与校准"
role = "主导开发者"
org = "Vograce"
location = "中国浙江义乌"
start = "2024 年 12 月"
end = "2025 年 7 月"
summary = "构建了用于定制印刷生产闭环色彩一致性控制的机器视觉流水线。"
details = [
  "*采集与检测：* 设计光学采集环境并实现特征匹配对齐与 ROI 提取，以适应不同光照和材料反射条件下的多样化印刷图案，实现稳健的 $Delta E$（CIEDE2000）计算。",
  "*算法：* 将 sRGB 测量值映射到 CMYK 空间，并采用自适应迭代步长反馈机制，把测得色差转化为印刷操作员可执行的墨量调整建议。",
  "*结果：* 通过 `Gradio` 快速原型与多轮迭代，将完整检测-推荐流水线优化到 ≤1 秒/张，在试产线中相较人工校色提速超过 20 倍；并进一步以 `Next.js` 和 `FastAPI` 构建全栈生产系统，支持企业部署。",
  "*成果：* 已获得 2 项软件著作权授权。",
]


